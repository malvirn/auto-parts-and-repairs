<style id="module-design-fixed-assets">

/* Fixed assets: page-specific Centric surface design. Header and sidebar remain owned by the app shell. */
body.dashboard-page.module-fixed-assets { --module-accent:var(--success); --module-glass:var(--surface); --module-edge:var(--border); --module-ink:var(--text); --module-muted:var(--muted); }
:root[data-theme="light"] body.dashboard-page.module-fixed-assets { --module-glass:rgba(250,252,254,.84); --module-edge:rgba(255,255,255,.9); --module-ink:#172431; --module-muted:#5c6b79; }
body.dashboard-page.module-fixed-assets .main { color:var(--module-ink); font-family:Inter,"Segoe UI",system-ui,sans-serif; }
body.dashboard-page.module-fixed-assets .main .page-section { margin:0 0 22px; padding:clamp(14px,2vw,22px); border:1px solid rgba(255,255,255,.08); border-radius:18px; background:rgba(8,18,25,.18); }
:root[data-theme="light"] body.dashboard-page.module-fixed-assets .main .page-section { background:rgba(255,255,255,.24); border-color:rgba(26,45,60,.08); }
body.dashboard-page.module-fixed-assets .main :is(.section-heading,.page-intro) { display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:15px; }
body.dashboard-page.module-fixed-assets .main :is(.section-heading h1,.section-heading h2,.page-title,h1) { color:var(--module-ink); font-weight:750; letter-spacing:-.035em; }
body.dashboard-page.module-fixed-assets .main .section-kicker { color:var(--module-accent); font-size:.7rem; font-weight:800; letter-spacing:.13em; text-transform:uppercase; }
body.dashboard-page.module-fixed-assets .main :is(.section-note,.muted,.empty-state,.help-text) { color:var(--module-muted); }
body.dashboard-page.module-fixed-assets .main :is(.module-tabs,.panel,#asset-form,.modal,#assets-table) { background:linear-gradient(145deg,var(--module-glass),color-mix(in srgb,var(--module-glass) 72%,transparent)) !important; border:1px solid var(--module-edge) !important; border-radius:16px !important; box-shadow:0 14px 34px rgba(0,0,0,.17),inset 0 1px 0 rgba(255,255,255,.08) !important; color:var(--module-ink); -webkit-backdrop-filter:blur(18px) saturate(145%); backdrop-filter:blur(18px) saturate(145%); }
body.dashboard-page.module-fixed-assets .main :is(table,thead,tbody,tfoot,tr) { background:transparent !important; }
body.dashboard-page.module-fixed-assets .main :is(th,td) { border-color:var(--module-edge) !important; color:var(--module-ink); }
body.dashboard-page.module-fixed-assets .main th { color:var(--module-muted); font-size:.68rem; font-weight:800; letter-spacing:.09em; text-transform:uppercase; }
body.dashboard-page.module-fixed-assets .main tbody tr:hover { background:color-mix(in srgb,var(--module-accent) 10%,transparent) !important; }
body.dashboard-page.module-fixed-assets .main :is(input:not([type=checkbox]):not([type=radio]),select,textarea) { background:rgba(3,13,20,.28) !important; border:1px solid var(--module-edge) !important; border-radius:10px; color:var(--module-ink) !important; min-height:40px; }
:root[data-theme="light"] body.dashboard-page.module-fixed-assets .main :is(input:not([type=checkbox]):not([type=radio]),select,textarea) { background:rgba(255,255,255,.78) !important; }
body.dashboard-page.module-fixed-assets .main :is(input,textarea)::placeholder { color:var(--module-muted) !important; }
body.dashboard-page.module-fixed-assets .main :is(button,.btn,[role="button"]) { border-radius:10px; }
body.dashboard-page.module-fixed-assets .main :is(.btn--primary,.btn-primary,.button-primary,button[type=submit]) { background:linear-gradient(135deg,var(--module-accent),color-mix(in srgb,var(--module-accent) 72%,#182633)) !important; border-color:var(--module-accent) !important; color:#fff !important; box-shadow:0 7px 18px color-mix(in srgb,var(--module-accent) 22%,transparent); }
body.dashboard-page.module-fixed-assets .main :is(.status-badge,.badge,.pill,.tag) { border-radius:999px; }
body.dashboard-page.module-fixed-assets .main :is(.table-wrap,.table-container,.table-responsive) { overflow-x:auto; }
@media(max-width:720px) {
 body.dashboard-page.module-fixed-assets .main .page-section { padding:13px; border-radius:14px; margin-bottom:15px; }
 body.dashboard-page.module-fixed-assets .main :is(.section-heading h1,.section-heading h2,.page-title,h1) { font-size:1.2rem; }
 body.dashboard-page.module-fixed-assets .main :is(.module-tabs,.panel,#asset-form,.modal,#assets-table) { border-radius:13px !important; }
}
@media(prefers-reduced-motion:reduce) { body.dashboard-page.module-fixed-assets .main * { scroll-behavior:auto; } }

</style>

<body class="dashboard-page system-page dashboard-workshop module-fixed-assets">
  <div class="app-shell">
  

    <main class="main">
      <div class="module-tabs" style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px;">
      <a href="accounting.html" class="btn"><i data-lucide="arrow-left"></i> All Modules</a>
      <a href="ledger.html" class="btn"><i data-lucide="book-open-check"></i> Ledger</a>
      <a href="payables.html" class="btn"><i data-lucide="banknote"></i> Payables</a>
      <a href="cashbook.html" class="btn"><i data-lucide="wallet"></i> Cash Book</a>
      <a href="commissions.html" class="btn"><i data-lucide="percent"></i> Commissions</a>
      <a href="landed-cost.html" class="btn"><i data-lucide="ship"></i> Landed Cost</a>
      <a href="fixed-assets.html" class="btn btn--primary"><i data-lucide="wrench"></i> Fixed Assets</a>
      <a href="financial-statements.html" class="btn"><i data-lucide="file-bar-chart"></i> Statements</a>
      </div>

      

      <section class="page-section">
        <div class="section-heading"><div><p class="section-kicker">Register an asset</p><h2><i class="section-heading-icon" data-lucide="plus"></i>Add Fixed Asset</h2></div></div>
        <form id="asset-form" class="panel" style="padding:20px;">
          <div class="form-grid" style="max-width:none; grid-template-columns: repeat(3, 1fr);">
            <div class="field"><label>Name</label><input type="text" id="asset-name" placeholder="e.g. 2-Post Vehicle Lift" required /></div>
            <div class="field"><label>Category</label>
              <select id="asset-category">
                <option>Equipment</option><option>Vehicle</option><option>Tools</option><option>Furniture</option><option>Other</option>
              </select>
            </div>
            <div class="field"><label>Purchase Date</label><input type="date" id="asset-date" required /></div>
            <div class="field"><label>Purchase Cost ($)</label><input type="number" id="asset-cost" step="0.01" min="0.01" required /></div>
            <div class="field"><label>Salvage Value ($)</label><input type="number" id="asset-salvage" step="0.01" min="0" value="0" /></div>
            <div class="field"><label>Useful Life (years)</label><input type="number" id="asset-life" step="0.5" min="0.5" value="5" required /></div>
            <div class="field"><label>Payment</label>
              <select id="asset-payment">
                <option value="on_credit">On Credit (creates a Payable)</option>
                <option value="paid">Paid Immediately</option>
              </select>
            </div>
            <div class="field" id="asset-payment-account-field"><label>Paid From</label><select id="asset-payment-account"></select></div>
          </div>
          <button type="submit" class="btn btn--primary" style="margin-top:10px;"><i data-lucide="plus"></i> Add Asset</button>
          <p id="asset-form-message" class="form-message"></p>
        </form>
      </section>

      <section class="page-section">
        <div class="section-heading">
          <div><p class="section-kicker">Monthly</p><h2><i class="section-heading-icon" data-lucide="trending-down"></i>Depreciation</h2></div>
          <button id="run-depreciation-btn" type="button" class="btn btn--primary"><i data-lucide="trending-down"></i> Run This Month's Depreciation</button>
        </div>
      </section>

      <section class="page-section">
        <div class="section-heading"><div><p class="section-kicker">Register</p><h2><i class="section-heading-icon" data-lucide="list"></i>All Fixed Assets</h2></div></div>
        <div class="panel">
          <table>
            <thead><tr><th>Name</th><th>Category</th><th>Purchase Cost</th><th>Accum. Depreciation</th><th>Net Book Value</th><th>Status</th><th></th></tr></thead>
            <tbody id="assets-table"><tr><td colspan="7" class="empty-state"><i data-lucide="loader-circle"></i><span>Loading…</span></td></tr></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <div id="dispose-modal" class="modal-overlay hidden">
    <div class="modal">
      <h3>Dispose Asset</h3>
      <p id="dispose-summary" style="color:var(--text-muted); font-size:.88rem;"></p>
      <div class="field"><label>Disposal Date</label><input type="date" id="dispose-date" /></div>
      <div class="field"><label>Proceeds Received ($)</label><input type="number" id="dispose-proceeds" step="0.01" min="0" value="0" /></div>
      <div class="field"><label>Deposit Proceeds Into</label><select id="dispose-account"></select></div>
      <p id="dispose-preview" style="font-size:.85rem; color:var(--text-muted);"></p>
      <div style="display:flex; gap:8px; margin-top:10px;">
        <button id="dispose-save" type="button" class="btn btn--primary"><i data-lucide="check"></i> Confirm Disposal</button>
        <button id="dispose-cancel" type="button" class="btn"><i data-lucide="x"></i> Cancel</button>
      </div>
      <p id="dispose-form-message" class="form-message"></p>
    </div>
  </div>

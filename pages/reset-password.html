<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../js/theme.js?v=chrome-buttons-1"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1012">
  <title>Reset Password | Centric Auto Mobile</title>
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;font-family:Inter,"Segoe UI",system-ui,sans-serif;background:#0b1012;color:#eef3ef}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 15% 0,rgba(31,196,103,.15),transparent 42%),#0b1012}
    main{width:min(100%,460px);padding:clamp(24px,6vw,40px);border:1px solid rgba(31,196,103,.25);border-radius:24px;background:linear-gradient(155deg,#14201b,#0d1411);box-shadow:0 24px 70px rgba(0,0,0,.4)}
    img{display:block;width:76px;height:60px;object-fit:contain;margin-bottom:20px}
    h1{margin:0;font-size:clamp(25px,6vw,32px);letter-spacing:-.03em}
    p{color:#9fb0a6;line-height:1.55}
    label{display:block;margin:18px 0 7px;color:#c5d0c9;font-size:.86rem;font-weight:600}
    input{width:100%;min-height:46px;padding:10px 12px;border:1px solid rgba(31,196,103,.3);border-radius:12px;background:#0a100e;color:#eef3ef;font:inherit}
    input:focus{outline:2px solid rgba(31,196,103,.55);outline-offset:1px}
    button,.back{display:inline-flex;align-items:center;justify-content:center;min-height:44px;margin-top:18px;padding:0 18px;border:0;border-radius:12px;background:linear-gradient(180deg,#1fc467,#12a150);color:#fff;font:700 .95rem Inter,system-ui,sans-serif;text-decoration:none;cursor:pointer}
    button:disabled{opacity:.55;cursor:wait}
    #reset-message{min-height:1.4em;margin:15px 0 0;font-size:.9rem}
    #reset-message[data-tone=error]{color:#ff8585}
    #reset-message[data-tone=success]{color:#68d391}
    #reset-message[data-tone=info]{color:#b4c3bb}
    .back{border:1px solid rgba(31,196,103,.25);background:#101a16;color:#eef3ef}
  </style>
  <link rel="stylesheet" href="../css/style.css?v=chrome-buttons-1">
  <link rel="stylesheet" href="../css/mh-theme.css?v=chrome-buttons-1">
  <link rel="stylesheet" href="../css/dashboard-shell.css?v=chrome-buttons-1">
  <link rel="stylesheet" href="../css/ui-consistency.css?v=chrome-buttons-1">
  <link rel="stylesheet" href="../css/dashboard-chrome.css?v=collapsed-layout-fix-1&v=chrome-buttons-1">
  <link rel="stylesheet" href="../css/theme-background.css?v=engine-bay-bg-1&v=chrome-buttons-1">
  <link rel="stylesheet" href="../css/chrome-buttons.css?v=chrome-buttons-1">
</head>
<body>
  <main>
    <img src="../assets/logo.png" alt="Centric Auto Mobile">
    <h1>Choose a new password</h1>
    <p>Use a strong password you have not used here before. The reset link is temporary and can only be used once.</p>
    <form id="reset-form" hidden>
      <label for="new-password">New password</label>
      <input id="new-password" type="password" autocomplete="new-password" minlength="8" required>
      <label for="confirm-password">Confirm new password</label>
      <input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required>
      <button id="reset-submit" type="submit" class="chrome"><span class="led" aria-hidden="true"></span>Update password</button>
    </form>
    <p id="reset-message" role="status" aria-live="polite" data-tone="info">Checking your reset link…</p>
    <a class="back" href="../login.html">Back to sign in</a>
  </main>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script type="module" src="../js/reset-password.js?v=chrome-buttons-1"></script>
</body>
</html>

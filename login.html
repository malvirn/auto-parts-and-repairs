<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AUTO PARTS &amp; REPAIRS — Sign In</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="main" style="max-width:460px; margin:0 auto; padding-top:12vh;">
    <section class="panel" style="padding:28px;">
      <h1 style="margin-bottom:8px;">AUTO PARTS &amp; REPAIRS Sign In</h1>
      <p style="color:var(--text-muted); margin-bottom:22px;">Use your authorized staff account.</p>
      <form id="login-form">
        <div class="field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn--primary">Sign In</button>
        <p id="login-message" role="alert" style="margin-top:14px; color:var(--danger);"></p>
      </form>
    </section>
  </main>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script type="module" src="js/login.js"></script>
</body>
</html>

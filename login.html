<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Centric Auto Mobile — Sign In</title>
  <meta name="theme-color" content="#0b0f14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Centric Auto Mobile">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/login-sync.css?v=login-v2">
  <script src="js/pwa.js" defer></script>
  <script>window.__ACLOGO="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 110"><ellipse cx="86" cy="55" rx="80" ry="48" fill="#ff7a12"/><ellipse cx="82" cy="55" rx="64" ry="35" fill="#00a884"/><path d="M180 20a40 38 0 1 0 0 70" fill="none" stroke="#ff7a12" stroke-width="13" stroke-linecap="round"/><path d="M52 86L82 20l30 66M64 64h38" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>');</script>
</head>
<body class="login-page">
  <div class="ld-top" aria-hidden="true"><i id="ld-fill"></i></div>

  <main class="stage">
    <div class="card">
      <img class="logo" src="assets/logo.png" alt="Centric Auto Mobile" onerror="this.onerror=null;this.src=window.__ACLOGO">
      <h1>Sign in</h1>

      <div id="fp-box" class="fp-box" hidden>
        <button type="button" id="fp-signin" class="fp-btn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 11c0 3-.5 5.5-2 8M8.5 20c1.6-2.4 2-4.800 2-9a1.500 1.500 0 0 1 3 0c0 2.200-.2 4.300-.9 6.300M6 18.500C7 16 7 13.500 7 11a5 5 0 0 1 10 0c0 1 0 2-.2 3M4 15c.6-1.300 1-2.600 1-4a7 7 0 0 1 14 0c0 .7 0 1.300-.1 2"/></svg>
          <span>Use fingerprint or Face ID</span>
        </button>
        <p id="fp-message" class="msg" role="status"></p>
        <div class="or"><span>or</span></div>
      </div>

      <form id="login-form" novalidate>
        <label for="login-email">Email</label>
        <input type="email" id="login-email" autocomplete="username" autocapitalize="none" spellcheck="false" required />

        <label for="login-password">Password</label>
        <div class="pw">
          <input type="password" id="login-password" autocomplete="current-password" required />
          <button type="button" class="toggle-password" id="toggle-password" aria-label="Show password">
            <svg class="eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.500-7 10-7 10 7 10 7-3.500 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.600 6.100A9.800 9.800 0 0 1 12 6c6.500 0 10 6 10 6a17 17 0 0 1-3.200 4M6.600 6.600C3.900 8.300 2 12 2 12s3.500 7 10 7c1.700 0 3.200-.4 4.500-1M9.900 9.900a3 3 0 0 0 4.200 4.200"/></svg>
          </button>
        </div>

        <button type="submit" class="btn" id="login-submit"><span>Sign in</span></button>
        <p id="login-message" class="msg" role="alert"></p>
      </form>

      <button type="button" class="forgot-link" id="forgot-password">Forgot password?</button>
    </div>
  </main>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script type="module" src="js/login.js"></script>
  <script>
    (() => {
      const pw = document.getElementById("login-password");
      const btn = document.getElementById("toggle-password");
      btn.addEventListener("click", () => {
        const show = pw.type === "password";
        pw.type = show ? "text" : "password";
        btn.classList.toggle("on", show);
        btn.setAttribute("aria-label", show ? "Hide password" : "Show password");
      });
    })();
  </script>
</body>
</html>

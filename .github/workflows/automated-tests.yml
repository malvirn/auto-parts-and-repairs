name: Centric automated tests
on:
  push:
  pull_request:
jobs:
  test:
    name: vitest-and-js-checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run Vitest
        run: npm test
      - name: Run existing JavaScript checks
        run: npm run check:js

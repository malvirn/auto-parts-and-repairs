name: Centric API checks

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/centric-api-checks.yml"
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/centric-api-checks.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund

      - name: Build API
        run: npm run build

      - name: Run API unit tests
        run: npm test

      - name: Build Cloudflare Worker bundle
        run: npm run build:worker

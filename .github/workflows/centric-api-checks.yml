name: Centric API checks

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/centric-api-checks.yml"
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/centric-api-checks.yml"

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Commit generated lockfile to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "API lockfile is already up to date."
          else
            git commit -m "Add reproducible Centric API lockfile"
            git push origin HEAD:main
          fi

      - name: Build API
        run: npm run build

      - name: Run API unit tests
        run: npm test

      - name: Build Cloudflare Worker bundle
        run: npm run build:worker

      - name: Smoke test Worker runtime without database writes
        shell: bash
        run: |
          printf 'SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_test_key\n' > .dev.vars
          npm run dev:worker -- --port 8787 > /tmp/centric-api-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true; rm -f .dev.vars' EXIT

          live_ok=false
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail http://127.0.0.1:8787/api/v1/health/live > /tmp/centric-api-live.json; then
              live_ok=true
              break
            fi
            sleep 1
          done

          if [ "$live_ok" != "true" ]; then
            cat /tmp/centric-api-worker.log
            exit 1
          fi

          grep -q '"status":"ok"' /tmp/centric-api-live.json
          curl --silent --show-error --fail http://127.0.0.1:8787/api/v1/health/ready | grep -q '"status":"ready"'

          me_status=$(curl --silent --output /tmp/centric-api-me.json --write-out '%{http_code}' http://127.0.0.1:8787/api/v1/me)
          test "$me_status" = "401"

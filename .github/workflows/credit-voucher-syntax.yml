name: Credit voucher JavaScript syntax
on:
  push:
    branches: [main]
    paths:
      - 'js/credit-vouchers.js'
      - 'js/customer-credit.js'
      - 'js/customers.js'
      - 'js/quotations.js'
      - 'js/repairs.js'
      - 'js/prefetch.js'
      - 'pages/repairs.html'
      - 'pages/receipts.html'
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - '.github/workflows/credit-voucher-syntax.yml'
  pull_request:
    paths:
      - 'js/credit-vouchers.js'
      - 'js/customer-credit.js'
      - 'js/repairs.js'
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - '.github/workflows/credit-voucher-syntax.yml'
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check changed JavaScript modules
        run: |
          node --check js/credit-vouchers.js
          node --check js/customer-credit.js
          node --check js/customers.js
          node --check js/quotations.js
          node --check js/repairs.js
          node --check js/prefetch.js
      - name: Check customer credit security migration
        run: |
          python - <<'PY'
          from pathlib import Path
          migration = Path('supabase/migrations/20261111120000_require_confirmation_for_deposit_application.sql').read_text(encoding='utf-8')
          assert 'Could not safely remove automatic credit application' in migration
          assert 'revoke all on function public.apply_quotation_deposits_to_repair_job' in migration
          tests = Path('supabase/tests/customer_credit_confirmation_security.sql').read_text(encoding='utf-8')
          assert 'Recording a quotation deposit must not bypass customer confirmation' in tests
          print('Customer credit security migration checks passed')
          PY
      - name: Check inline page scripts
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess, tempfile
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__(); self.active=False; self.items=[]; self.current=[]
              def handle_starttag(self, tag, attrs):
                  if tag == 'script':
                      attrs=dict(attrs); kind=attrs.get('type','text/javascript').lower()
                      self.active=('src' not in attrs and kind in ('text/javascript','application/javascript','module',''))
                      if self.active: self.current=[]
              def handle_data(self, data):
                  if self.active: self.current.append(data)
              def handle_endtag(self, tag):
                  if tag == 'script' and self.active:
                      self.items.append(''.join(self.current)); self.active=False
          for page in ('pages/repairs.html','pages/receipts.html'):
              parser=Scripts(); parser.feed(Path(page).read_text(encoding='utf-8'))
              for index, source in enumerate(parser.items, 1):
                  if not source.strip(): continue
                  with tempfile.NamedTemporaryFile('w', suffix='.mjs', encoding='utf-8') as handle:
                      handle.write(source); handle.flush()
                      subprocess.run(['node','--check',handle.name],check=True)
                  print(f'{page}: inline script {index} passed')
          PY
